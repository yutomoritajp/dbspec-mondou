services:
  front:
    build: ./front
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - 3000:3000

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8000:8000

  db:
    image: postgres:17
    restart: unless-stopped
    env_file: ./db/.env
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  
volumes:
  postgres_data: